# Runs on a schedule. If ESPN cookies are missing or expired, the job
# leaves existing JSON in place so the live site does not go blank.
name: Refresh current ESPN season
on:
  schedule:
    - cron: "0 11 * * 2"
    - cron: "0 11 * * 1"
  workflow_dispatch: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install espn-api
        run: pip install espn-api
      - name: Pull current seasons
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: |
          if [ -z "$ESPN_S2" ] || [ -z "$SWID" ]; then
            echo "No ESPN cookies in secrets. Skipping pull; archives unchanged."
            exit 0
          fi
          python scripts/import_league_data.py || echo "Pull failed; leaving existing JSON in place."
      - name: Commit archives if changed
        run: |
          git config user.name "fantasy-balls-bot"
          git config user.email "bot@users.noreply.github.com"
          git add web/data data || true
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "chore: refresh ESPN archives"
          git pull --rebase origin main
          git push
          echo "Pushed archive refresh"
